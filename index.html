<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Компас — веб-браузер</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#33395C">
<link rel="icon" type="image/png" href="icon.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg: #F4F1EA;
    --ink: #1F2430;
    --ink-soft: #5B5F6B;
    --indigo: #33395C;
    --coral: #C4592F;
    --line: #D9D4C6;
    --card: #FFFFFF;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-bottom: 80px;
  }

  .topbar{
    width:100%;
    display:flex;
    justify-content:flex-end;
    padding:1.25rem 2rem 0.5rem;
    font-size:13px;
    color:var(--ink-soft);
  }

  main{
    flex:1;
    width:100%;
    max-width:640px;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:1rem 1.5rem 2rem;
  }

  .mark{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:1.5rem;
  }

  .needle{ width:34px; height:34px; flex-shrink:0; }

  .wordmark{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:34px;
    letter-spacing:-0.5px;
    color:var(--indigo);
  }

  .wordmark em{ font-style:italic; color:var(--coral); }

  form{ width:100%; }

  .search-row{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:999px;
    padding:14px 22px;
  }

  .search-row svg{ flex-shrink:0; color:var(--ink-soft); }

  input[type="text"], input[type="email"], input[type="password"]{
    flex:1; border:none; outline:none;
    background:transparent; font-family:'Inter', sans-serif;
    font-size:16px; color:var(--ink);
  }

  .clear-btn{
    background:none; border:none; cursor:pointer;
    color:var(--ink-soft); display:none; padding:2px;
  }
  .clear-btn.show{ display:flex; }

  .engines{
    display:flex; gap:8px; margin-top:1.25rem;
    flex-wrap:wrap; justify-content:center;
  }

  .engine-btn{
    font-family:'Inter', sans-serif; font-size:13px; font-weight:500;
    padding:7px 15px; border-radius:999px; border:1px solid var(--line);
    background:var(--card); color:var(--ink); cursor:pointer;
  }

  .engine-btn.active{
    background:var(--indigo); border-color:var(--indigo); color:#F4F1EA;
  }

  .go-btn{
    width:100%; margin-top:1rem; padding:13px;
    border-radius:999px; border:none; background:var(--coral);
    color:#FFF6EF; font-family:'Inter', sans-serif;
    font-size:15px; font-weight:600; cursor:pointer;
  }

  .page-section { display: none; width: 100%; }
  .page-section.active { display: block; }

  .card-box {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 1.25rem;
    margin-top: 1.5rem;
    width: 100%;
  }

  .history-list { list-style: none; margin-top: 10px; }
  .history-item {
    display: flex; justify-content: space-between;
    padding: 10px 0; border-bottom: 1px solid var(--line);
    font-size: 14px;
  }

  .notes-area {
    width: 100%; height: 180px; border: 1px solid var(--line);
    border-radius: 12px; padding: 12px; font-family: 'Inter', sans-serif;
    font-size: 14px; resize: none; outline: none; background: var(--bg);
  }

  .profile-box { text-align: center; }
  .input-field {
    width: 100%; padding: 12px 14px; border: 1px solid var(--line);
    border-radius: 12px; margin-bottom: 10px; font-size: 14px; outline: none;
    background: var(--bg);
  }

  /* Нижняя панель */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; height: 65px;
    background: var(--card); border-top: 1px solid var(--line);
    display: flex; justify-content: space-around; align-items: center; z-index: 9999;
  }

  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: none; border: none; color: var(--ink-soft);
    font-size: 11px; font-weight: 500; cursor: pointer; width: 25%;
    padding: 8px 0;
  }

  .nav-item.active { color: var(--coral); font-weight: 600; }
  .nav-icon { font-size: 20px; pointer-events: none; }
  .nav-item span { pointer-events: none; }
  .status-msg { font-size: 13px; color: var(--coral); margin-top: 8px; }
</style>
</head>
<body>

  <div class="topbar"><span>Компас PWA</span></div>

  <main>
    <div class="mark">
      <svg class="needle" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="17" cy="17" r="15.5" stroke="#33395C" stroke-width="1.5"/>
        <path d="M17 6L21 17L17 28L13 17L17 6Z" fill="#C4592F"/>
        <circle cx="17" cy="17" r="2" fill="#33395C"/>
      </svg>
      <div class="wordmark">Комп<em>а</em>с</div>
    </div>

    <div class="page-section active" id="sec-home">
      <form id="searchForm">
        <div class="search-row">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input id="q" type="text" placeholder="Поиск в сети или URL..." autocomplete="off" />
          <button type="button" class="clear-btn" id="clearBtn">✕</button>
        </div>

        <div class="engines">
          <button type="button" class="engine-btn" data-engine="google">Google</button>
          <button type="button" class="engine-btn" data-engine="yandex">Яндекс</button>
          <button type="button" class="engine-btn" data-engine="duckduckgo">DuckDuckGo</button>
          <button type="button" class="engine-btn" data-engine="bing">Bing</button>
        </div>

        <button type="submit" class="go-btn">Искать / Перейти</button>
      </form>
    </div>

    <div class="page-section" id="sec-history">
      <div class="card-box">
        <h3>История поиска</h3>
        <ul class="history-list" id="historyList">
          <li class="history-item"><span>История пуста</span></li>
        </ul>
        <button class="engine-btn" style="margin-top:15px; width:100%" id="clearHistoryBtn">Очистить историю</button>
      </div>
    </div>

    <div class="page-section" id="sec-notes">
      <div class="card-box">
        <h3>Облачные заметки</h3>
        <p id="syncStatus" style="font-size:12px; color:var(--ink-soft); margin-bottom:10px;">Войдите в аккаунт для синхронизации</p>
        <textarea class="notes-area" id="notesInput" placeholder="Введите ваш текст..."></textarea>
      </div>
    </div>

    <div class="page-section" id="sec-profile">
      <div class="card-box profile-box" id="authBox">
        <h3 id="authTitle">Вход в аккаунт</h3>
        <p style="font-size:13px; color:var(--ink-soft); margin:10px 0 15px;">Синхронизируйте заметки на всех устройствах</p>
        
        <input type="email" id="emailInput" class="input-field" placeholder="Ваш Email" />
        <input type="password" id="passwordInput" class="input-field" placeholder="Пароль" />
        
        <button class="go-btn" id="loginBtn">Войти</button>
        <button class="engine-btn" id="registerBtn" style="width:100%; margin-top:8px;">Зарегистрироваться</button>
        <p class="status-msg" id="authStatus"></p>
      </div>

      <div class="card-box profile-box" id="userBox" style="display:none;">
        <h3>Вы вошли!</h3>
        <p id="userEmail" style="font-size:14px; color:var(--indigo); margin:10px 0; font-weight:600;"></p>
        <button class="go-btn" id="logoutBtn" style="background:var(--indigo);">Выйти из аккаунта</button>
      </div>
    </div>

  </main>

  <nav class="bottom-nav">
    <button type="button" class="nav-item active" data-target="sec-home"><span class="nav-icon">🏠</span><span>Главное</span></button>
    <button type="button" class="nav-item" data-target="sec-history"><span class="nav-icon">🕒</span><span>История</span></button>
    <button type="button" class="nav-item" data-target="sec-notes"><span class="nav-icon">📝</span><span>Заметки</span></button>
    <button type="button" class="nav-item" data-target="sec-profile"><span class="nav-icon">👤</span><span>Профиль</span></button>
  </nav>

<script>
  // 1. НАВИГАЦИЯ МЕЖДУ ВКЛАДКАМИ (РАБОТАЕТ ВСЕГДА В ПЕРВУЮ ОЧЕРЕДЬ)
  const navItems = document.querySelectorAll('.nav-item');
  const pageSections = document.querySelectorAll('.page-section');
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR2ZXRrcm90Z3Jpb2NydnV5bG50Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MTQ4ODQsImV4cCI6MjEwMjI5MDg4NH0.1hKNtw5wg57---dUPROR-YvSgQv79MTbPCVSIj-szxE';
  navItems.forEach(item => {
    item.addEventListener('click', (e) => {
      e.preventDefault();
      const targetId = item.getAttribute('data-target');
      
      navItems.forEach(i => i.classList.remove('active'));
      pageSections.forEach(s => s.classList.remove('active'));

      item.classList.add('active');
      document.getElementById(targetId).classList.add('active');
    });
  });

  // 2. ИНИЦИАЛИЗАЦИЯ SUPABASE
  const SUPABASE_URL = 'https://tvetkrotgriocrvuyint.supabase.co';
  // Вставьте ниже весь скопированный длинный ключ anon public
  const SUPABASE_KEY = 'ВСТАВЬТЕ_СЮДА_ВАШ_КЛЮЧ'; 

  let sbClient = null;
  let currentUser = null;

  try {
    if (window.supabase && SUPABASE_KEY !== 'ВСТАВЬТЕ_СЮДА_ВАШ_КЛЮЧ') {
      sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      checkUser();
    }
  } catch(e) {
    console.log("Supabase error:", e);
  }

  async function checkUser() {
    if (!sbClient) return;
    const { data: { user } } = await sbClient.auth.getUser();
    if (user) {
      currentUser = user;
      showUserProfile(user.email);
      loadCloudNotes();
    }
  }

  // 3. АВТОРИЗАЦИЯ И РЕГИСТРАЦИЯ
  document.getElementById('registerBtn').addEventListener('click', async () => {
    const email = document.getElementById('emailInput').value;
    const password = document.getElementById('passwordInput').value;
    const status = document.getElementById('authStatus');

    if (!sbClient) { status.innerText = 'Укажите ключ Supabase в коде!'; return; }
    if (!email || !password) { status.innerText = 'Заполните все поля!'; return; }

    const { data, error } = await sbClient.auth.signUp({ email, password });
    if (error) {
      status.style.color = 'var(--coral)';
      status.innerText = error.message;
    } else {
      status.style.color = 'green';
      status.innerText = 'Регистрация успешна!';
      if(data.user) {
        currentUser = data.user;
        showUserProfile(email);
      }
    }
  });

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const email = document.getElementById('emailInput').value;
    const password = document.getElementById('passwordInput').value;
    const status = document.getElementById('authStatus');

    if (!sbClient) { status.innerText = 'Укажите ключ Supabase в коде!'; return; }

    const { data, error } = await sbClient.auth.signInWithPassword({ email, password });
    if (error) {
      status.style.color = 'var(--coral)';
      status.innerText = 'Ошибка: ' + error.message;
    } else {
      currentUser = data.user;
      showUserProfile(data.user.email);
      loadCloudNotes();
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    if (sbClient) await sbClient.auth.signOut();
    currentUser = null;
    document.getElementById('authBox').style.display = 'block';
    document.getElementById('userBox').style.display = 'none';
    document.getElementById('syncStatus').innerText = 'Войдите в аккаунт для синхронизации';
  });

  function showUserProfile(email) {
    document.getElementById('authBox').style.display = 'none';
    document.getElementById('userBox').style.display = 'block';
    document.getElementById('userEmail').innerText = email;
    document.getElementById('syncStatus').innerText = '🟢 Облачные заметки синхронизированы';
  }

  // 4. ЗАМЕТКИ
  const notesArea = document.getElementById('notesInput');
  notesArea.value = localStorage.getItem('compass_notes') || '';

  notesArea.addEventListener('input', () => {
    localStorage.setItem('compass_notes', notesArea.value);
    if (currentUser && sbClient) saveCloudNotes(notesArea.value);
  });

  async function saveCloudNotes(content) {
    await sbClient.from('notes').upsert({ user_id: currentUser.id, content: content });
  }

  async function loadCloudNotes() {
    const { data } = await sbClient.from('notes').select('content').eq('user_id', currentUser.id).single();
    if (data && data.content) {
      notesArea.value = data.content;
      localStorage.setItem('compass_notes', data.content);
    }
  }

  // 5. ПОИСК И ИСТОРИЯ
  const form = document.getElementById('searchForm');
  const input = document.getElementById('q');
  const clearBtn = document.getElementById('clearBtn');
  const engineBtns = document.querySelectorAll('.engine-btn');

  const engineUrls = {
    google: q => 'https://www.google.com/search?q=' + encodeURIComponent(q),
    yandex: q => 'https://yandex.ru/search/?text=' + encodeURIComponent(q),
    duckduckgo: q => 'https://duckduckgo.com/?q=' + encodeURIComponent(q),
    bing: q => 'https://www.bing.com/search?q=' + encodeURIComponent(q)
  };

  let engine = localStorage.getItem('selectedEngine') || 'google';

  function setActiveEngine(targetEngine) {
    engine = targetEngine;
    localStorage.setItem('selectedEngine', engine);
    engineBtns.forEach(b => {
      if(b.dataset.engine) b.classList.toggle('active', b.dataset.engine === engine);
    });
  }
  setActiveEngine(engine);

  engineBtns.forEach(btn => {
    if(btn.dataset.engine) {
      btn.addEventListener('click', () => setActiveEngine(btn.dataset.engine));
    }
  });

  input.addEventListener('input', () => clearBtn.classList.toggle('show', input.value.length > 0));
  clearBtn.addEventListener('click', () => { input.value = ''; clearBtn.classList.remove('show'); input.focus(); });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const val = input.value.trim();
    if (!val) return;
    saveToHistory(val);
    const isSearchQuery = val.includes(' ') || !val.includes('.');
    const targetUrl = isSearchQuery ? engineUrls[engine](val) : (/^https?:\/\//i.test(val) ? val : 'https://' + val);
    window.open(targetUrl, '_blank');
  });

  function saveToHistory(query) {
    let history = JSON.parse(localStorage.getItem('compass_history') || '[]');
    history.unshift({ query, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
    history = history.slice(0, 20);
    localStorage.setItem('compass_history', JSON.stringify(history));
    renderHistory();
  }

  function renderHistory() {
    const list = document.getElementById('historyList');
    let history = JSON.parse(localStorage.getItem('compass_history') || '[]');
    if (history.length === 0) {
      list.innerHTML = '<li class="history-item"><span>История пуста</span></li>';
      return;
    }
    list.innerHTML = history.map(item => `<li class="history-item"><span>${item.query}</span><span style="color:var(--ink-soft)">${item.time}</span></li>`).join('');
  }

  document.getElementById('clearHistoryBtn').addEventListener('click', () => {
    localStorage.removeItem('compass_history');
    renderHistory();
  });
  renderHistory();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
  }
</script>
</body>
</html>
