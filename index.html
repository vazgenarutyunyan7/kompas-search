<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Компас — веб-браузер</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#33395C">
<link rel="icon" type="image/png" href="icon.png">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg: #F4F1EA;
    --ink: #1F2430;
    --ink-soft: #5B5F6B;
    --indigo: #33395C;
    --coral: #C4592F;
    --line: #D9D4C6;
    --card: #FFFFFF;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-bottom: 70px; /* Отступ для нижней панели */
  }

  .topbar{
    width:100%;
    display:flex;
    justify-content:flex-end;
    padding:1.25rem 2rem 0.5rem;
    font-size:13px;
    color:var(--ink-soft);
  }

  main{
    flex:1;
    width:100%;
    max-width:640px;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:1rem 1.5rem 2rem;
  }

  .mark{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:1.5rem;
  }

  .needle{ width:34px; height:34px; flex-shrink:0; }

  .wordmark{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:34px;
    letter-spacing:-0.5px;
    color:var(--indigo);
  }

  .wordmark em{ font-style:italic; color:var(--coral); }

  form{ width:100%; }

  .search-row{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:999px;
    padding:14px 22px;
    transition:border-color .15s ease, box-shadow .15s ease;
  }

  .search-row:focus-within{
    border-color:var(--indigo);
    box-shadow:0 0 0 3px rgba(51,57,92,0.08);
  }

  .search-row svg{ flex-shrink:0; color:var(--ink-soft); }

  input[type="text"]{
    flex:1; border:none; outline:none;
    background:transparent; font-family:'Inter', sans-serif;
    font-size:16px; color:var(--ink);
  }

  input[type="text"]::placeholder{ color:#A8A49A; }

  .clear-btn{
    background:none; border:none; cursor:pointer;
    color:var(--ink-soft); display:none; padding:2px;
  }
  .clear-btn.show{ display:flex; }

  .engines{
    display:flex; gap:8px; margin-top:1.25rem;
    flex-wrap:wrap; justify-content:center;
  }

  .engine-btn{
    font-family:'Inter', sans-serif; font-size:13px; font-weight:500;
    padding:7px 15px; border-radius:999px; border:1px solid var(--line);
    background:var(--card); color:var(--ink); cursor:pointer;
  }

  .engine-btn.active{
    background:var(--indigo); border-color:var(--indigo); color:#F4F1EA;
  }

  .go-btn{
    width:100%; margin-top:1rem; padding:13px;
    border-radius:999px; border:none; background:var(--coral);
    color:#FFF6EF; font-family:'Inter', sans-serif;
    font-size:15px; font-weight:600; cursor:pointer;
  }

  /* Разделы приложения */
  .page-section { display: none; width: 100%; }
  .page-section.active { display: block; }

  .card-box {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 1.25rem;
    margin-top: 1.5rem;
    width: 100%;
  }

  /* Список истории */
  .history-list { list-style: none; margin-top: 10px; }
  .history-item {
    display: flex; justify-content: space-between;
    padding: 10px 0; border-bottom: 1px solid var(--line);
    font-size: 14px;
  }

  /* Заметки */
  .notes-area {
    width: 100%; height: 180px; border: 1px solid var(--line);
    border-radius: 12px; padding: 12px; font-family: 'Inter', sans-serif;
    font-size: 14px; resize: none; outline: none; background: var(--bg);
  }

  /* Профиль / Синхронизация */
  .profile-box { text-align: center; }
  .input-field {
    width: 100%; padding: 10px 14px; border: 1px solid var(--line);
    border-radius: 10px; margin-bottom: 10px; font-size: 14px; outline: none;
  }

  /* Нижняя панель навигации (Bottom Bar) */
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 65px;
    background: var(--card);
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 100;
  }

  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
  }

  .nav-item.active {
    color: var(--coral);
    font-weight: 600;
  }

  .nav-icon { font-size: 20px; }
</style>
</head>
<body>

  <div class="topbar"><span>Компас PWA</span></div>

  <main>
    <div class="mark">
      <svg class="needle" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="17" cy="17" r="15.5" stroke="#33395C" stroke-width="1.5"/>
        <path d="M17 6L21 17L17 28L13 17L17 6Z" fill="#C4592F"/>
        <circle cx="17" cy="17" r="2" fill="#33395C"/>
      </svg>
      <div class="wordmark">Комп<em>а</em>с</div>
    </div>

    <div class="page-section active" id="sec-home">
      <form id="searchForm">
        <div class="search-row">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input id="q" type="text" placeholder="Поиск в сети или URL..." autocomplete="off" autofocus />
          <button type="button" class="clear-btn" id="clearBtn">✕</button>
        </div>

        <div class="engines">
          <button type="button" class="engine-btn" data-engine="google">Google</button>
          <button type="button" class="engine-btn" data-engine="yandex">Яндекс</button>
          <button type="button" class="engine-btn" data-engine="duckduckgo">DuckDuckGo</button>
          <button type="button" class="engine-btn" data-engine="bing">Bing</button>
        </div>

        <button type="submit" class="go-btn">Искать / Перейти</button>
      </form>
    </div>

    <div class="page-section" id="sec-history">
      <div class="card-box">
        <h3>История поиска</h3>
        <ul class="history-list" id="historyList">
          <li class="history-item"><span>История пуста</span></li>
        </ul>
        <button class="engine-btn" style="margin-top:15px; width:100%" onclick="clearHistory()">Очистить историю</button>
      </div>
    </div>

    <div class="page-section" id="sec-notes">
      <div class="card-box">
        <h3>Мои заметки</h3>
        <p style="font-size:12px; color:var(--ink-soft); margin-bottom:10px;">Заметки сохраняются автоматически</p>
        <textarea class="notes-area" id="notesInput" placeholder="Введите ваш текст..."></textarea>
      </div>
    </div>

    <div class="page-section" id="sec-profile">
      <div class="card-box profile-box">
        <h3>Личный кабинет</h3>
        <p style="font-size:13px; color:var(--ink-soft); margin:10px 0 15px;">Вход для синхронизации между устройствами</p>
        <input type="email" class="input-field" placeholder="Ваш Email" />
        <input type="password" class="input-field" placeholder="Пароль" />
        <button class="go-btn" style="margin-top:5px;">Войти / Зарегистрироваться</button>
      </div>
    </div>

  </main>

  <nav class="bottom-nav">
    <button class="nav-item active" data-target="sec-home">
      <span class="nav-icon">🏠</span>
      <span>Главное</span>
    </button>
    <button class="nav-item" data-target="sec-history">
      <span class="nav-icon">🕒</span>
      <span>История</span>
    </button>
    <button class="nav-item" data-target="sec-notes">
      <span class="nav-icon">📝</span>
      <span>Заметки</span>
    </button>
    <button class="nav-item" data-target="sec-profile">
      <span class="nav-icon">👤</span>
      <span>Профиль</span>
    </button>
  </nav>

<script>
 // Инициализация Supabase с защитой от ошибок
const SUPABASE_URL = 'https://tvetkrotgriocrvuyint.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR2ZXRrcm90Z3Jpb2NydnV5bG50Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MTQ4ODQsImV4cCI6MjEwMjI5MDg4NH0.1hKNtw5wg57---dUPROR-YvSgQv79MTbPCVSIj-szxE

let supabase = null;

try {
  if (typeof window.supabase !== 'undefined') {
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  }
} catch (err) {
  console.error("Ошибка инициализации Supabase:", err);
}
  // Поиск и сохранение в историю
  const form = document.getElementById('searchForm');
  const input = document.getElementById('q');
  const clearBtn = document.getElementById('clearBtn');
  const engineBtns = document.querySelectorAll('.engine-btn');

  const engineUrls = {
    google: q => 'https://www.google.com/search?q=' + encodeURIComponent(q),
    yandex: q => 'https://yandex.ru/search/?text=' + encodeURIComponent(q),
    duckduckgo: q => 'https://duckduckgo.com/?q=' + encodeURIComponent(q),
    bing: q => 'https://www.bing.com/search?q=' + encodeURIComponent(q)
  };

  let engine = localStorage.getItem('selectedEngine') || 'google';

  function setActiveEngine(targetEngine) {
    engine = targetEngine;
    localStorage.setItem('selectedEngine', engine);
    engineBtns.forEach(b => b.classList.toggle('active', b.dataset.engine === engine));
  }
  setActiveEngine(engine);

  engineBtns.forEach(btn => btn.addEventListener('click', () => setActiveEngine(btn.dataset.engine)));

  input.addEventListener('input', () => clearBtn.classList.toggle('show', input.value.length > 0));
  clearBtn.addEventListener('click', () => { input.value = ''; clearBtn.classList.remove('show'); input.focus(); });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const val = input.value.trim();
    if (!val) return;

    saveToHistory(val);

    const isSearchQuery = val.includes(' ') || !val.includes('.');
    const targetUrl = isSearchQuery ? engineUrls[engine](val) : (/^https?:\/\//i.test(val) ? val : 'https://' + val);
    window.open(targetUrl, '_blank');
  });

  // История
  function saveToHistory(query) {
    let history = JSON.parse(localStorage.getItem('compass_history') || '[]');
    history.unshift({ query, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
    history = history.slice(0, 20); // хранить последние 20
    localStorage.setItem('compass_history', JSON.stringify(history));
    renderHistory();
  }

  function renderHistory() {
    const list = document.getElementById('historyList');
    let history = JSON.parse(localStorage.getItem('compass_history') || '[]');
    if (history.length === 0) {
      list.innerHTML = '<li class="history-item"><span>История пуста</span></li>';
      return;
    }
    list.innerHTML = history.map(item => `<li class="history-item"><span>${item.query}</span><span style="color:var(--ink-soft)">${item.time}</span></li>`).join('');
  }

  function clearHistory() {
    localStorage.removeItem('compass_history');
    renderHistory();
  }
  renderHistory();

  // Заметки
  const notesArea = document.getElementById('notesInput');
  notesArea.value = localStorage.getItem('compass_notes') || '';
  notesArea.addEventListener('input', () => localStorage.setItem('compass_notes', notesArea.value));
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
  }
</script>
</body>
</html>
