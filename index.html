<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Компас — поиск в интернете</title>

<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#33395C">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'><circle cx='17' cy='17' r='15.5' stroke='%2333395C' stroke-width='1.5' fill='%23F4F1EA'/><path d='M17 6L21 17L17 28L13 17L17 6Z' fill='%23C4592F'/><circle cx='17' cy='17' r='2' fill='%2333395C'/></svg>">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg: #F4F1EA;
    --ink: #1F2430;
    --ink-soft: #5B5F6B;
    --indigo: #33395C;
    --coral: #C4592F;
    --line: #D9D4C6;
    --card: #FFFFFF;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .topbar{
    width:100%;
    display:flex;
    justify-content:flex-end;
    padding:1.25rem 2rem;
    font-size:13px;
    color:var(--ink-soft);
  }

  .topbar span{ cursor:default; }

  main{
    flex:1;
    width:100%;
    max-width:640px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:2rem 1.5rem 4rem;
  }

  .mark{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:2.75rem;
  }

  .needle{
    width:34px; height:34px;
    flex-shrink:0;
  }

  .wordmark{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:34px;
    letter-spacing:-0.5px;
    color:var(--indigo);
  }

  .wordmark em{
    font-style:italic;
    color:var(--coral);
  }

  form{ width:100%; }

  .search-row{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:999px;
    padding:14px 22px;
    transition:border-color .15s ease, box-shadow .15s ease;
  }

  .search-row:focus-within{
    border-color:var(--indigo);
    box-shadow:0 0 0 3px rgba(51,57,92,0.08);
  }

  .search-row svg{ flex-shrink:0; color:var(--ink-soft); }

  input[type="text"]{
    flex:1;
    border:none;
    outline:none;
    background:transparent;
    font-family:'Inter', sans-serif;
    font-size:16px;
    color:var(--ink);
  }

  input[type="text"]::placeholder{ color:#A8A49A; }

  .clear-btn{
    background:none;
    border:none;
    cursor:pointer;
    color:var(--ink-soft);
    display:none;
    padding:2px;
  }
  .clear-btn.show{ display:flex; }

  .error{
    color:var(--coral);
    font-size:13px;
    margin-top:8px;
    padding-left:6px;
    display:none;
  }
  .error.show{ display:block; }

  .engines{
    display:flex;
    gap:8px;
    margin-top:1.75rem;
    flex-wrap:wrap;
    justify-content:center;
  }

  .engine-btn{
    font-family:'Inter', sans-serif;
    font-size:14px;
    font-weight:500;
    padding:9px 18px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
    cursor:pointer;
    transition:all .15s ease;
  }

  .engine-btn:hover{ border-color:var(--ink-soft); }

  .engine-btn.active{
    background:var(--indigo);
    border-color:var(--indigo);
    color:#F4F1EA;
  }

  .go-btn{
    width:100%;
    margin-top:1.25rem;
    padding:14px;
    border-radius:999px;
    border:none;
    background:var(--coral);
    color:#FFF6EF;
    font-family:'Inter', sans-serif;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:transform .12s ease, background .15s ease;
  }

  .go-btn:hover{ background:#A94A25; }
  .go-btn:active{ transform:scale(0.98); }

  /* Блок быстрых закладок */
  .quick-links {
    display: flex;
    gap: 12px;
    margin-top: 1.75rem;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
  }

  .bookmark-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    text-decoration: none;
    transition: all .15s ease;
  }

  .bookmark-btn:hover {
    border-color: var(--indigo);
    transform: translateY(-1px);
  }

  .hint{
    margin-top:2rem;
    font-size:13px;
    color:var(--ink-soft);
    text-align:center;
    line-height:1.6;
    max-width:420px;
  }

  footer{
    padding:1.5rem;
    font-size:12px;
    color:#A8A49A;
  }

  @media (max-width:480px){
    .wordmark{ font-size:28px; }
    .needle{ width:28px; height:28px; }
  }
</style>
</head>
<body>

  <div class="topbar"><span>веб-приложение Компас</span></div>

  <main>
    <div class="mark">
      <svg class="needle" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="17" cy="17" r="15.5" stroke="#33395C" stroke-width="1.5"/>
        <path d="M17 6L21 17L17 28L13 17L17 6Z" fill="#C4592F"/>
        <circle cx="17" cy="17" r="2" fill="#33395C"/>
      </svg>
      <div class="wordmark">Комп<em>а</em>с</div>
    </div>

    <form id="searchForm">
      <div class="search-row">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input id="q" type="text" placeholder="Введите слова или URL-адрес..." autocomplete="off" autofocus />
        <button type="button" class="clear-btn" id="clearBtn" aria-label="Очистить">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <p class="error" id="errMsg">Сначала введите запрос или URL.</p>

      <div class="engines" role="group" aria-label="Выбор поисковика">
        <button type="button" class="engine-btn" data-engine="google">Google</button>
        <button type="button" class="engine-btn" data-engine="yandex">Яндекс</button>
        <button type="button" class="engine-btn" data-engine="duckduckgo">DuckDuckGo</button>
        <button type="button" class="engine-btn" data-engine="bing">Bing</button>
      </div>

      <button type="submit" class="go-btn">Перейти / Искать</button>
    </form>

    <div class="quick-links">
      <a href="https://mail.google.com" target="_blank" rel="noopener" class="bookmark-btn">✉️ Gmail</a>
      <a href="https://e.mail.ru" target="_blank" rel="noopener" class="bookmark-btn">📬 Mail.ru</a>
      <a href="https://mail.yandex.ru" target="_blank" rel="noopener" class="bookmark-btn">🟡 Яндекс Почта</a>
      <a href="https://youtube.com" target="_blank" rel="noopener" class="bookmark-btn">▶️ YouTube</a>
    </div>

    <p class="hint">Введите запрос для поиска или прямой URL (например: mail.ru), чтобы перейти сразу на сайт в новой вкладке.</p>
  </main>

  <footer>Компас · офлайн-страница, поиск выполняется через интернет</footer>

<script>
  const form = document.getElementById('searchForm');
  const input = document.getElementById('q');
  const clearBtn = document.getElementById('clearBtn');
  const errMsg = document.getElementById('errMsg');
  const engineBtns = document.querySelectorAll('.engine-btn');

  const engineUrls = {
    google: q => 'https://www.google.com/search?q=' + encodeURIComponent(q),
    yandex: q => 'https://yandex.ru/search/?text=' + encodeURIComponent(q),
    duckduckgo: q => 'https://duckduckgo.com/?q=' + encodeURIComponent(q),
    bing: q => 'https://www.bing.com/search?q=' + encodeURIComponent(q)
  };

  let engine = localStorage.getItem('selectedEngine') || 'google';

  function setActiveEngine(targetEngine) {
    engine = targetEngine;
    localStorage.setItem('selectedEngine', engine);
    engineBtns.forEach(b => {
      b.classList.toggle('active', b.dataset.engine === engine);
    });
  }

  setActiveEngine(engine);

  engineBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      setActiveEngine(btn.dataset.engine);
    });
  });

  input.addEventListener('input', () => {
    clearBtn.classList.toggle('show', input.value.length > 0);
    if (input.value.trim()) errMsg.classList.remove('show');
  });

  function clearInput() {
    input.value = '';
    clearBtn.classList.remove('show');
    input.focus();
  }

  clearBtn.addEventListener('click', clearInput);

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') clearInput();
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const val = input.value.trim();

    if (!val) {
      errMsg.classList.add('show');
      return;
    }

    errMsg.classList.remove('show');

    const isSearchQuery = val.includes(' ') || !val.includes('.');

    let targetUrl;
    if (isSearchQuery) {
      targetUrl = engineUrls[engine](val);
    } else {
      targetUrl = /^https?:\/\//i.test(val) ? val : 'https://' + val;
    }

    window.open(targetUrl, '_blank', 'noopener,noreferrer');
  });
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('ServiceWorker успешно зарегистрирован'))
        .catch(err => console.log('Ошибка ServiceWorker:', err));
    });
  }
</script>

</body>
</html>
