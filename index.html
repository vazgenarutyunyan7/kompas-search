<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Компас — Веб-Браузер</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

  :root {
    --bg: #F4F1EA;
    --ink: #1F2430;
    --ink-soft: #5B5F6B;
    --indigo: #33395C;
    --coral: #C4592F;
    --line: #D9D4C6;
    --card: #FFFFFF;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Панель браузера */
  .browser-toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: var(--card);
    border-bottom: 1px solid var(--line);
  }

  .nav-btn {
    background: none;
    border: 1px solid var(--line);
    border-radius: 50%;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--ink-soft);
    transition: all 0.15s ease;
  }

  .nav-btn:hover {
    background: var(--bg);
    color: var(--ink);
  }

  .address-form {
    flex: 1;
    display: flex;
    align-items: center;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 16px;
  }

  .address-form input {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    font-size: 14px;
    color: var(--ink);
  }

  .quick-bookmarks {
    display: flex;
    gap: 8px;
  }

  .bm-btn {
    font-size: 13px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
    text-decoration: none;
  }

  .bm-btn:hover {
    border-color: var(--indigo);
    color: var(--indigo);
  }

  /* Рабочая область с фреймом */
  .viewport-container {
    flex: 1;
    position: relative;
    width: 100%;
    height: 100%;
    background: #ffffff;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  .notice {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(31, 36, 48, 0.85);
    color: #fff;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 12px;
    pointer-events: none;
    opacity: 0.9;
  }
</style>
</head>
<body>

  <header class="browser-toolbar">
    <button class="nav-btn" id="reloadBtn" title="Обновить">↻</button>
    
    <form class="address-form" id="browserForm">
      <input id="urlInput" type="text" placeholder="Введите URL или поисковый запрос..." autocomplete="off" />
    </form>

    <div class="quick-bookmarks">
      <button class="bm-btn" data-url="https://mail.google.com/">Gmail</button>
      <button class="bm-btn" data-url="https://e.mail.ru/">Mail.ru</button>
      <button class="bm-btn" data-url="https://wikipedia.org">Wikipedia</button>
    </div>
  </header>

  <main class="viewport-container">
    <iframe id="webViewport" src="about:blank"></iframe>
    <div class="notice">Примечание: Сайты с защитой от встраивания (Gmail, Google) могут заблокировать показ во фрейме.</div>
  </main>

<script>
  const form = document.getElementById('browserForm');
  const input = document.getElementById('urlInput');
  const iframe = document.getElementById('webViewport');
  const reloadBtn = document.getElementById('reloadBtn');
  const bmBtns = document.querySelectorAll('.bm-btn');

  function navigateTo(query) {
    let url = query.trim();
    if (!url) return;

    // Проверяем, введен ли валидный URL или поисковый запрос
    if (!/^https?:\/\//i.test(url)) {
      if (url.includes('.') && !url.includes(' ')) {
        url = 'https://' + url;
      } else {
        // Если это запрос, ищем через DuckDuckGo (он менее строг к встроенным ссылкам)
        url = 'https://duckduckgo.com/?q=' + encodeURIComponent(url);
      }
    }

    input.value = url;
    iframe.src = url;
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    navigateTo(input.value);
  });

  reloadBtn.addEventListener('click', () => {
    iframe.src = iframe.src;
  });

  bmBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const targetUrl = btn.dataset.url;
      navigateTo(targetUrl);
    });
  });
</script>

</body>
</html>
